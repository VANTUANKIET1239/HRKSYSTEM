
services:

  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: .
      dockerfile: ApiGateway/ApiGateway/Dockerfile
    depends_on:
      - hrk.auth
      - hrk.game
    ports:
      - "5000:8080"


  hrk.auth:
    image: ${DOCKER_REGISTRY-}hrkauth
    build:
      context: .
      dockerfile: Services/AUTH/HRK.AUTH/Dockerfile
    ports:
      - "5001:8080"

  hrk.game:
    image: ${DOCKER_REGISTRY-}hrkgame
    build:
      context: .
      dockerfile: Services/HRKGAME/HRK.GAME/Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      Redis__InstanceName: "hrk:game:"
      Redis__DefaultExpirationMinutes: "10"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"

  hrk.realtime:
    image: ${DOCKER_REGISTRY-}hrkrealtime
    build:
      context: .
      dockerfile: Services/HRKREALTIME/HRK.REALTIME/Dockerfile
    ports:
      - "5003:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      Redis__Enabled: "true"
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"

  redis:
    image: redis:7-alpine
    container_name: hrk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-guest}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  redis-data:
    

