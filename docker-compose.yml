
services:

  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: .
      dockerfile: ApiGateway/ApiGateway/Dockerfile
    depends_on:
      - hrk.auth
      - hrk.game
      - hrk.language
    ports:
      - "5000:8080"
    environment:
      InternalApi__Services__health-auth__BaseAddress: "http://hrk.auth:8080"
      InternalApi__Services__health-game__BaseAddress: "http://hrk.game:8080"
      InternalApi__Services__health-language__BaseAddress: "http://hrk.language:8080"
      InternalApi__Services__health-admin__BaseAddress: "http://hrk.admin:8080"


  hrk.auth:
    image: ${DOCKER_REGISTRY-}hrkauth
    build:
      context: .
      dockerfile: Services/AUTH/HRK.AUTH/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      Database__ConnectionString: "${AUTH_DATABASE_CONNECTION:?Set AUTH_DATABASE_CONNECTION to the HRK_AUTH SQL Server connection string}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
      InternalApi__Services__language__BaseAddress: "http://hrk.language:8080"
      Localization__RedisConnectionString: "redis:6379,abortConnect=false,connectTimeout=1000,asyncTimeout=1000"
      Localization__RedisKeyPrefix: "${LOCALIZATION_REDIS_PREFIX:-hrk:dev:i18n:}"

  hrk.game:
    image: ${DOCKER_REGISTRY-}hrkgame
    build:
      context: .
      dockerfile: Services/HRKGAME/HRK.GAME/Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      InternalApi__Services__language__BaseAddress: "http://hrk.language:8080"
      Localization__RedisConnectionString: "redis:6379,abortConnect=false,connectTimeout=1000,asyncTimeout=1000"
      Localization__RedisKeyPrefix: "${LOCALIZATION_REDIS_PREFIX:-hrk:dev:i18n:}"
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      Redis__InstanceName: "hrk:game:"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"

  hrk.realtime:
    image: ${DOCKER_REGISTRY-}hrkrealtime
    build:
      context: .
      dockerfile: Services/HRKREALTIME/HRK.REALTIME/Dockerfile
    ports:
      - "5003:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      Redis__Enabled: "true"
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"

  hrk.language:
    image: ${DOCKER_REGISTRY-}hrklanguage
    build:
      context: .
      dockerfile: Services/HRKLANGUAGE/HRK.LANGUAGE/Dockerfile
    ports:
      - "5005:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__ConnectionString: "${LANGUAGE_DATABASE_CONNECTION:?Set LANGUAGE_DATABASE_CONNECTION in .env to the HRK_LANGUAGE SQL Server connection string}"
      Localization__RedisConnectionString: "redis:6379,abortConnect=false,connectTimeout=1000,asyncTimeout=1000"
      Localization__RedisKeyPrefix: "${LOCALIZATION_REDIS_PREFIX:-hrk:dev:i18n:}"

  hrk.admin:
    image: ${DOCKER_REGISTRY-}hrkadmin
    build:
      context: .
      dockerfile: Services/HRKADMIN/HRK.ADMIN/Dockerfile
    ports:
      - "127.0.0.1:5006:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to the same signing key used by AUTH and GAME}"
      InternalApi__Services__gateway__BaseAddress: "http://apigateway:8080"
      InternalApi__Services__auth__BaseAddress: "http://hrk.auth:8080"
      InternalApi__Services__game__BaseAddress: "http://hrk.game:8080"
      InternalApi__Services__realtime__BaseAddress: "http://hrk.realtime:8080"
      InternalApi__Services__activity__BaseAddress: "http://hrk.activity:8080"
      InternalApi__Services__language__BaseAddress: "http://hrk.language:8080"

  redis:
    image: redis:7-alpine
    container_name: hrk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-guest}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  redis-data:
    

